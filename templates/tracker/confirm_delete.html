{% extends "base.html" %}
{% block title %}Delete {{ kind }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <h1 style="margin-bottom:8px">Delete {{ kind }}?</h1>
  <p>You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
  {% if warning %}<p class="muted">{{ warning }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <a class="btn" href="{{ cancel_url }}">Cancel</a>
      <button class="btn btn-danger" type="submit">Delete {{ kind }}</button>
    </div>
  </form>
</div></div>
{% endblock %}
